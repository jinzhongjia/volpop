name: 功能建议
description: 提议新功能或改进
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决什么问题
      description: 说明使用场景，比如“我需要经常切换到……”
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议的做法
  - type: textarea
    id: alternatives
    attributes:
      label: 目前的替代做法
      description: 例如现在是通过 pavucontrol 或 pactl 完成的
