name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm --needed base-devel git meson ninja pkgconf github-cli \
            gtk4 libpulse gtk4-layer-shell desktop-file-utils
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check version matches tag
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          meson setup build
          version=$(meson introspect build --projectinfo | sed -n 's/.*"version": "\([^"]*\)".*/\1/p')
          test "v$version" = "$GITHUB_REF_NAME" || { echo "meson version $version != tag $GITHUB_REF_NAME"; exit 1; }
      - name: Build tarball (runs the test suite)
        run: meson dist -C build
      - name: Extract release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          cat notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/meson-dist/*.tar.xz build/meson-dist/*.sha256sum \
            --title "volpop ${GITHUB_REF_NAME#v}" --notes-file notes.md
